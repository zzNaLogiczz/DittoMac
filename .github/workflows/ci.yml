name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: ./scripts/run-tests.sh
      - name: Build and package (release)
        run: |
          swift build -c release
          ./scripts/make-app.sh
