name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # 产物文件名统一用不带 v 的版本号(与 make-app/make-dmg 一致)
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./scripts/run-tests.sh

      - name: Build app
        env:
          DITTOMAC_VERSION: ${{ github.ref_name }}
        run: |
          swift build -c release
          ./scripts/make-app.sh

      # 可选:用仓库 Secret 里的稳定签名证书签名(p12 base64)。
      # 设置 DITTOMAC_SIGN_P12 / DITTOMAC_SIGN_PASSWORD 两个 Secret 后,
      # 所有发布版用同一证书签名 → 用户更新版本时辅助功能授权保持有效。
      - name: Stable signing (optional)
        if: env.DITTOMAC_SIGN_P12 != ''
        env:
          DITTOMAC_SIGN_P12: ${{ secrets.DITTOMAC_SIGN_P12 }}
          DITTOMAC_SIGN_PASSWORD: ${{ secrets.DITTOMAC_SIGN_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/dittomac.p12"
          echo "$DITTOMAC_SIGN_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$HOME/Library/Keychains/login.keychain-db" \
            -P "$DITTOMAC_SIGN_PASSWORD" -T /usr/bin/codesign || true
          security find-identity -v -p codesigning
          IDENTITY=$(security find-identity -v -p codesigning | awk '/"(DittoMac|DittoMac Dev)"/{print $2; exit}')
          codesign --force --sign "$IDENTITY" --identifier local.dittomac.app DittoMac.app

      - name: Package tar.gz(无 quarantine,curl 安装用)
        run: |
          tar -czf "DittoMac-${VERSION}-arm64.tar.gz" DittoMac.app
          shasum -a 256 "DittoMac-${VERSION}-arm64.tar.gz" > "DittoMac-${VERSION}-arm64.tar.gz.sha256"

      - name: Package DMG(拖拽安装)
        env:
          DITTOMAC_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/make-dmg.sh
          shasum -a 256 "DittoMac-${VERSION}-arm64.dmg" > "DittoMac-${VERSION}-arm64.dmg.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            DittoMac-${{ env.VERSION }}-arm64.dmg
            DittoMac-${{ env.VERSION }}-arm64.dmg.sha256
            DittoMac-${{ env.VERSION }}-arm64.tar.gz
            DittoMac-${{ env.VERSION }}-arm64.tar.gz.sha256
          generate_release_notes: true
